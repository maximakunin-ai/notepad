const months={"ноября":"НОЯБРЬ 2026","декабря":"ДЕКАБРЬ 2026"};
const custom=JSON.parse(localStorage.getItem('winter-trip-content')||'{}');
days.forEach(d=>{d[3]='';});
Object.keys(custom).forEach(k=>{if(days[Number(k)]){if(typeof custom[k].title==='string')days[Number(k)][2]=custom[k].title;if(typeof custom[k].plan==='string')days[Number(k)][3]=custom[k].plan;if(typeof custom[k].ideas==='string')days[Number(k)][4]=custom[k].ideas;}});
const calendar=document.getElementById('calendar');
const weekdayNames=['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];
const weekdayMap={'Понедельник':0,'Вторник':1,'Среда':2,'Четверг':3,'Пятница':4,'Суббота':5,'Воскресенье':6};
const labels=document.createElement('div');
labels.className='weekdays';
weekdayNames.forEach(name=>{const label=document.createElement('div');label.textContent=name;labels.append(label);});
const grid=document.createElement('div');
grid.className='grid';
calendar.append(labels,grid);
const firstDayOffset=weekdayMap[days[0][1]];
for(let pad=0;pad<firstDayOffset;pad++){const blank=document.createElement('div');blank.className='empty-day';grid.append(blank);}
days.forEach((d,i)=>{
  const [date,weekday,place,plan]=d;
  const monthName=date.split(' ')[1];
  const b=document.createElement('button');
  const dayNumber=Number(date.split(' ')[0]);
  const isVacation=(monthName==='декабря'&&dayNumber>=5&&dayNumber<=20)||(weekday==='Суббота'||weekday==='Воскресенье')||(monthName==='декабря'&&dayNumber===25);
  b.className='day'+(plan!=="—"?' special':'')+(isVacation?' vacation':'');
  b.dataset.i=i;
  const monthLabel=(i===0||date.startsWith('1 декабря'))?'<div class="month-stamp">'+(monthName==='ноября'?'НОЯ':'ДЕК')+'</div>':'';
  const planItems=String(d[3]||'').split(String.fromCharCode(10)).concat(String(d[3]||'').split('•')).map(x=>x.trim()).filter(Boolean);
  const preview=planItems.length?'<ul class="preview-plan">'+planItems.map(x=>'<li>'+escapeHTML(x)+'</li>').join('')+'</ul>':'<div class="preview-empty">＋ добавить обязательные планы</div>';
  b.innerHTML='<div class="num">ДЕНЬ '+String(i+1).padStart(2,'0')+'</div>'+monthLabel+'<div class="date">'+date.split(' ')[0]+'</div><div class="weekday">'+weekday+'</div><div class="place">'+escapeHTML(place)+'</div>'+preview;
  grid.append(b);
  b.addEventListener('click',()=>openDay(i));
});
const overlay=document.getElementById('overlay');let current=0;const done=JSON.parse(localStorage.getItem('winter-trip-done')||'{}');
function escapeHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;');}
function renderCards(){document.querySelectorAll('.day').forEach(b=>{const i=Number(b.dataset.i),d=days[i],p=b.querySelector('.place');if(p)p.textContent=d[2];const old=b.querySelector('.preview-plan,.preview-empty');if(old)old.remove();const items=String(d[3]||'').split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean);if(items.length){const ul=document.createElement('ul');ul.className='preview-plan';items.forEach(x=>{const li=document.createElement('li');li.textContent=x;ul.append(li);});b.append(ul);}else{const empty=document.createElement('div');empty.className='preview-empty';empty.textContent='＋ добавить обязательные планы';b.append(empty);}});}
function renderDone(){document.querySelectorAll('.day').forEach(b=>b.classList.toggle('done',!!done[b.dataset.i]));}
function openDay(i){current=i;const d=days[i];document.getElementById('mdate').textContent=d[0]+' · '+d[1]+' · день '+(i+1)+' из '+days.length;document.getElementById('title').textContent=d[2];document.getElementById('mplace').textContent='Зимнее путешествие · 2026';document.getElementById('details').innerHTML='<section class="section"><h3>Название карточки</h3><input class="title-edit" id="editTitle" aria-label="Название карточки" value="'+escapeHTML(d[2])+'"></section><section class="section"><h3>Обязательные планы</h3><textarea class="edit-field" id="editPlan" aria-label="Обязательные планы">'+escapeHTML(d[3])+'</textarea><div class="edit-help">Каждый пункт с новой строки появится списком прямо на карточке.</div></section><section class="section"><h3>Идеи на день · варианты на выбор</h3><textarea class="edit-field" id="editIdeas" aria-label="Идеи на день">'+escapeHTML(d[4])+'</textarea><div class="edit-help">Можно менять текст, удалять варианты и добавлять свои идеи.</div></section><section class="section"><h3>Фильм на вечер · без повторов</h3><p class="film">'+escapeHTML(d[5])+'</p></section><p class="note">Твои правки сохраняются в этом браузере на этом устройстве. Чтобы изменить исходные рекомендации для всех посетителей, нужно обновить файл на GitHub.</p><div class="actions"><button class="save" id="saveText">Сохранить изменения</button><button id="resetText">Вернуть исходные рекомендации</button></div>';document.getElementById('saveText').onclick=()=>{days[i][2]=document.getElementById('editTitle').value.trim()||'Без названия';days[i][3]=document.getElementById('editPlan').value.trim();days[i][4]=document.getElementById('editIdeas').value.trim();custom[i]={title:days[i][2],plan:days[i][3],ideas:days[i][4]};localStorage.setItem('winter-trip-content',JSON.stringify(custom));renderCards();openDay(i);};document.getElementById('resetText').onclick=()=>{delete custom[i];localStorage.setItem('winter-trip-content',JSON.stringify(custom));location.reload();};document.getElementById('mark').textContent=done[i]?'✓ День отмечен':'✓ Отметить день';document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===days.length-1;overlay.classList.add('open');document.body.style.overflow='hidden';}
function close(){overlay.classList.remove('open');document.body.style.overflow='';}
document.getElementById('close').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.getElementById('prev').onclick=()=>openDay(current-1);document.getElementById('next').onclick=()=>openDay(current+1);document.getElementById('mark').onclick=()=>{done[current]=!done[current];localStorage.setItem('winter-trip-done',JSON.stringify(done));renderDone();openDay(current)};document.addEventListener('keydown',e=>{if(!overlay.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft'&&current>0)openDay(current-1);if(e.key==='ArrowRight'&&current<days.length-1)openDay(current+1)});renderCards();renderDone();
</script></body></html>
