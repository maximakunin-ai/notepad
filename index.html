<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102b25"><title>Зимнее путешествие · 2026</title>
<style>
:root{--bg:#102b25;--panel:#183a32;--gold:#d7b879;--cream:#f4eddf;--ink:#24352f;--muted:#b9c9bd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#285044,var(--bg) 65%);color:var(--cream);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
header{max-width:1200px;margin:auto;padding:34px 22px 22px;text-align:center} .eyebrow{color:var(--gold);letter-spacing:.22em;text-transform:uppercase;font:11px Arial,sans-serif}
h1{font-size:clamp(30px,5vw,54px);font-weight:400;margin:12px 0 8px}.sub{color:var(--muted);font:14px Arial,sans-serif}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:22px auto 0;font:12px Arial,sans-serif;color:var(--muted)}
main{max-width:1200px;margin:auto;padding:10px 18px 70px}.month{color:var(--gold);font:12px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;margin:24px 4px 12px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.day{position:relative;min-height:148px;border:1px solid #d8c69c;border-radius:10px;background:linear-gradient(145deg,#fff9ed,#e8dcc4);color:var(--ink);padding:13px 12px;text-align:left;cursor:pointer;box-shadow:0 5px 14px #06171055;transition:transform .18s,box-shadow .18s;overflow:hidden}
.day:hover{transform:translateY(-4px);box-shadow:0 10px 22px #06171088}.day:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.day:after{content:"";position:absolute;inset:5px;border:1px solid #cbb98e;border-radius:6px;pointer-events:none}
.num{font:11px Arial,sans-serif;letter-spacing:.12em;color:#8b7956}.date{font-size:30px;line-height:1.1;margin:8px 0 5px}.weekday{font:11px Arial,sans-serif;color:#7b806f}.place{font-size:14px;margin-top:9px;line-height:1.25}.tag{display:inline-block;margin-top:9px;font:9px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#775c2a}
.day.special{background:linear-gradient(145deg,#f8f0dc,#e6d2a8)}.day.done{opacity:.62}.day.done:before{content:"✓";position:absolute;right:15px;top:12px;color:#3d7959;font:20px Arial}
footer{text-align:center;color:#9eb2a5;font:12px Arial,sans-serif;padding:20px}
.overlay{display:none;position:fixed;inset:0;background:#061710d9;z-index:5;padding:18px;align-items:center;justify-content:center;backdrop-filter:blur(5px)}.overlay.open{display:flex}
.modal{width:min(680px,100%);max-height:min(88vh,850px);overflow:auto;background:var(--cream);color:var(--ink);border-radius:14px;padding:25px 25px 20px;box-shadow:0 25px 80px #0008;position:relative}
.close{position:absolute;right:16px;top:13px;border:0;background:transparent;font-size:28px;color:#52645b;cursor:pointer}
.mdate{font:11px Arial,sans-serif;letter-spacing:.18em;color:#8a7548;text-transform:uppercase}.modal h2{font-weight:400;font-size:34px;margin:8px 38px 4px 0}.mplace{color:#68766c;font:14px Arial,sans-serif;margin-bottom:20px}
.section{border-top:1px solid #d8cfbd;padding:14px 0}.section h3{font:10px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8a7548;margin:0 0 8px}.section p{font-size:16px;line-height:1.5;margin:0}.film{font-style:italic}.note{font:12px Arial,sans-serif;color:#77847b;line-height:1.45}
.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}.actions button{border:1px solid #a99b7d;background:transparent;color:var(--ink);border-radius:30px;padding:10px 15px;cursor:pointer;font:12px Arial}.actions .check{background:#244b3d;color:white;border-color:#244b3d}.actions button:disabled{opacity:.35}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:600px){header{padding-top:26px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}main{padding:4px 10px 50px}.day{min-height:126px;padding:10px 9px}.date{font-size:26px}.place{font-size:12px}.month{margin-top:20px}.modal{padding:22px 18px 16px}.modal h2{font-size:29px}.section p{font-size:15px}}
@media(max-width:360px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head>
<body>
<header><div class="eyebrow">Winter notes · 2026</div><h1>Зимнее путешествие</h1><div class="sub">26 ноября — 27 декабря · Германия, Франция и маленькие открытия</div><div class="legend"><span>✦ обязательные планы</span><span>❄ идеи на день</span><span>♫ кино на вечер</span></div></header>
<main id="calendar"></main><footer>Небольшой план, который можно менять по настроению. Отметки сохраняются на этом устройстве.</footer>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="title"><article class="modal"><button class="close" id="close" aria-label="Закрыть">×</button><div class="mdate" id="mdate"></div><h2 id="title"></h2><div class="mplace" id="mplace"></div><div id="details"></div><div class="actions"><button id="prev">← Предыдущий день</button><button class="check" id="mark">✓ Отметить день</button><button id="next">Следующий день →</button></div></article></div>
<script>
const days = [
["26 ноября","Четверг","Дорога в Германию","Отъезд из Клужа в Германию. Проверить билеты, документы, зарядки и тёплые вещи; в дороге — отдых и без плотного расписания.","Вечером устроиться в Ludwigshafen, купить продукты и прогуляться рядом с домом, если останутся силы.","Кудряшка Сью · Curly Sue (1991)"],
["27 ноября","Пятница","Ludwigshafen / Mannheim","Первый день в Германии — обязательных дальних поездок нет.","Спокойно освоиться: набережная Рейна, центр Mannheim и водонапорная башня Wasserturm. Заглянуть на первые рождественские рынки, если они уже открыты.","Неспящие в Сиэтле · Sleepless in Seattle (1993)"],
["28 ноября","Суббота","Heidelberg","—","Съездить в Heidelberg: старый мост, замок с видом на город, улочки Altstadt и рождественский рынок. Хороший день для красивых фотографий и неспешной прогулки.","Пока ты спал · While You Were Sleeping (1995)"],
["29 ноября","Воскресенье","Ludwigshafen","—","День без обязательств: поздний завтрак, прогулка вдоль Рейна, домашний вечер. Можно устроить небольшой киновечер с мамой.","You've Got Mail (1998)"],
["30 ноября","Понедельник","Speyer","—","Поехать в Speyer: впечатляющий собор, старый город и уютные площади. Небольшой город — удобно для прогулки на полдня.","Чудо на 34-й улице · Miracle on 34th Street (1994)"],
["1 декабря","Вторник","Mannheim","—","Посмотреть Mannheim без спешки: дворец, Paradeplatz, кварталы центра и праздничные огни. Вечером — отдых.","Один дома · Home Alone (1990)"],
["2 декабря","Среда","Отдых и восстановление","—","Свободный день. Можно сходить в бассейн или спа/термы, если хочется тепла и расслабления. Не планировать длинных переездов.","Семьянин · The Family Man (2000)"],
["3 декабря","Четверг","Strasbourg, Франция","—","Однодневная поездка в Strasbourg: рождественские рынки, собор Notre-Dame, Petite France и вечерние огни. Проверить транспорт и часы работы заранее.","Реальная любовь · Love Actually (2003)"],
["4 декабря","Пятница","Ludwigshafen","—","Неспешный день после поездки: кофе, покупки, прогулка по центру Mannheim или Ludwigshafen. Вечер оставить свободным.","Санта-Клаус · The Santa Clause (1994)"],
["5 декабря","Суббота","Frankfurt","—","Frankfurt на день: Römerberg, набережная Майна, вид с Main Tower (если погода ясная) и рождественский рынок.","Интуиция · Serendipity (2001)"],
["6 декабря","Воскресенье","Домашнее воскресенье","—","День для отдыха, готовки и приятной рутины. Можно выбрать короткую прогулку и купить что-нибудь к праздничному столу.","Подарок на Рождество · Jingle All the Way (1996)"],
["7 декабря","Понедельник","Worms","—","Поездка в Worms: собор, исторический центр и спокойная атмосфера небольшого немецкого города. Вернуться пораньше.","Французский поцелуй · French Kiss (1995)"],
["8 декабря","Вторник","Mannheim","—","Свободный день для дел, покупок и рождественских рынков. Если погода плохая — музей или уютное кафе.","Отпуск по обмену · The Holiday (2006)"],
["9 декабря","Среда","Baden-Baden","—","День термального отдыха: Baden-Baden, прогулка по Lichtentaler Allee и термы. Это один из 2–3 запланированных спа-дней; заранее проверить билеты и правила посещения.","Один дома 2 · Home Alone 2 (1992)"],
["10 декабря","Четверг","Heidelberg или дома","—","Повторить любимое место в Heidelberg или провести день совсем спокойно. Можно пройтись по Philosophenweg, если сухо и не скользко.","Рождественские каникулы · National Lampoon's Christmas Vacation (1989)"],
["11 декабря","Пятница","Mainz","—","Съездить в Mainz: собор, старый город, рыночная площадь и прогулка по набережной Рейна.","Рождественская история · A Christmas Story (1983)"],
["12 декабря","Суббота","Свободный день","—","Оставить день гибким: повторить понравившийся рынок, устроить шопинг или выбраться на природу. Никаких ранних подъёмов.","Кудряшка Сью · Curly Sue (1991)"],
["13 декабря","Воскресенье","Отдых / спа","—","Второй возможный спа-день: термы или бассейн поблизости. Альтернатива — домашний уют, прогулка и горячий чай.","Пока ты спал · While You Were Sleeping (1995)"],
["14 декабря","Понедельник","Подготовка к Парижу","—","Проверить билеты и маршрут в Париж, зарядить телефоны, подготовить удобную обувь и вещи. Лёгкий день без дальних поездок.","Неспящие в Сиэтле · Sleepless in Seattle (1993)"],
["15 декабря","Вторник","Париж, Франция","Поездка в Париж с мамой. Главный обязательный план дня.","Сделать день комфортным: Эйфелева башня снаружи или смотровая площадка, прогулка по Сене, Île de la Cité и рождественские витрины. Не пытаться объять весь Париж за один день; заложить паузы на кафе и отдых.","Французский поцелуй · French Kiss (1995)"],
["16 декабря","Среда","Восстановление","—","После Парижа — спокойный день. Поздний завтрак, короткая прогулка и разбор фотографий. Не ставить дальние планы.","You've Got Mail (1998)"],
["17 декабря","Четверг","Hamburg","Поездка в Гамбург. Обязательный план дня.","Если это поездка с ночёвкой — заселиться и гулять по Speicherstadt, HafenCity и набережной. Если одним днём — выбрать 2–3 главные точки и заранее проверить расписание транспорта.","Реальная любовь · Love Actually (2003)"],
["18 декабря","Пятница","Hamburg","Продолжение поездки в Гамбург, если остаёшься на ночь.","Miniatur Wunderland (билеты лучше бронировать заранее), Elbphilharmonie Plaza, Rathaus и рождественские рынки. Не перегружать день.","Чудо на 34-й улице · Miracle on 34th Street (1994)"],
["19 декабря","Суббота","Возвращение / свободный день","—","Возвращение из Гамбурга или день на восстановление — в зависимости от транспорта. Вечером никаких обязательств.","Семьянин · The Family Man (2000)"],
["20 декабря","Воскресенье","Зимний уют","—","Спокойный воскресный день. Можно выбрать любимый рождественский рынок, купить подарки или просто погулять по украшенному городу.","Санта-Клаус · The Santa Clause (1994)"],
["21 декабря","Понедельник","Heidelberg вечером","—","Если ещё не видел вечерний Heidelberg — съездить ради огней и атмосферы. Иначе оставить день свободным для дел.","Интуиция · Serendipity (2001)"],
["22 декабря","Вторник","Третий спа-день — по желанию","—","Опциональный третий спа/термальный день. Можно выбрать ближайший удобный вариант или полностью заменить его прогулкой и отдыхом.","Отпуск по обмену · The Holiday (2006)"],
["23 декабря","Среда","Подготовка к праздникам","—","Купить продукты и подарки, проверить праздничные часы транспорта и магазинов. Вечером — домашний фильм и уютная атмосфера.","Подарок на Рождество · Jingle All the Way (1996)"],
["24 декабря","Четверг","Сочельник","—","Провести день спокойно и по-семейному. В Германии многие магазины закрываются раньше; транспорт и заведения работают по особому расписанию — всё проверить заранее.","Один дома · Home Alone (1990)"],
["25 декабря","Пятница","Рождество","—","Праздничный день без дальних поездок. Прогулка, если погода позволяет, и время с близкими. Большинство магазинов закрыто.","Реальная любовь · Love Actually (2003)"],
["26 декабря","Суббота","Второй день Рождества","—","Ещё один спокойный праздничный день. Можно выбрать короткую прогулку или уютное кафе, но заранее проверить, что открыто.","Один дома 2 · Home Alone 2 (1992)"],
["27 декабря","Воскресенье","Возвращение в Cluj","Возвращение домой в Клуж-Напоку.","Дорога домой. Проверить билеты, документы, багаж и время прибытия. Оставить запас на пересадки и задержки.","Кудряшка Сью · Curly Sue (1991)"]
];
const months={"ноября":"НОЯБРЬ 2026","декабря":"ДЕКАБРЬ 2026"};
const calendar=document.getElementById('calendar');
days.forEach((d,i)=>{const [date,weekday,place,plan,idea,film]=d;const m=date.split(' ')[1];if(i===0||date.startsWith('1 декабря')){const h=document.createElement('div');h.className='month';h.textContent=months[m];calendar.append(h)}
const b=document.createElement('button');b.className='day'+(plan!=="—"?' special':'');b.dataset.i=i;b.innerHTML='<div class="num">ДЕНЬ '+String(i+1).padStart(2,'0')+'</div><div class="date">'+date.split(' ')[0]+'</div><div class="weekday">'+weekday+'</div><div class="place">'+place+'</div>'+(plan!=="—"?'<div class="tag">✦ важный план</div>':'');calendar.append(b);b.addEventListener('click',()=>openDay(i));});
const overlay=document.getElementById('overlay');let current=0;const done=JSON.parse(localStorage.getItem('winter-trip-done')||'{}');
function renderDone(){document.querySelectorAll('.day').forEach(b=>b.classList.toggle('done',!!done[b.dataset.i]));}
function openDay(i){current=i;const d=days[i];document.getElementById('mdate').textContent=d[0]+' · '+d[1]+' · день '+(i+1)+' из '+days.length;document.getElementById('title').textContent=d[2];document.getElementById('mplace').textContent='Зимнее путешествие · 2026';document.getElementById('details').innerHTML='<section class="section"><h3>Обязательные планы</h3><p>'+(d[3]==='—'?'Пока ничего обязательного — день можно оставить свободным.':d[3])+'</p></section><section class="section"><h3>Идеи на день</h3><p>'+d[4]+'</p></section><section class="section"><h3>Фильм на вечер</h3><p class="film">'+d[5]+'</p></section><p class="note">Планы и расписания заведений могут меняться. Особенно внимательно проверь транспорт и часы работы 24–26 декабря.</p>';document.getElementById('mark').textContent=done[i]?'✓ День отмечен':'✓ Отметить день';document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===days.length-1;overlay.classList.add('open');document.body.style.overflow='hidden';}
function close(){overlay.classList.remove('open');document.body.style.overflow='';}
document.getElementById('close').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.getElementById('prev').onclick=()=>openDay(current-1);document.getElementById('next').onclick=()=>openDay(current+1);document.getElementById('mark').onclick=()=>{done[current]=!done[current];localStorage.setItem('winter-trip-done',JSON.stringify(done));renderDone();openDay(current)};document.addEventListener('keydown',e=>{if(!overlay.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft'&&current>0)openDay(current-1);if(e.key==='ArrowRight'&&current<days.length-1)openDay(current+1)});renderDone();
</script></body></html>
