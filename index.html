const months={"ноября":"НОЯБРЬ 2026","декабря":"ДЕКАБРЬ 2026"};
const custom=JSON.parse(localStorage.getItem('winter-trip-content')||'{}');
days.forEach((d,i)=>{if(![2,18,24].includes(i))d[3]='';});
Object.keys(custom).forEach(k=>{if(days[Number(k)]){if(typeof custom[k].title==='string')days[Number(k)][2]=custom[k].title;if(typeof custom[k].plan==='string')days[Number(k)][3]=custom[k].plan;if(typeof custom[k].ideas==='string')days[Number(k)][4]=custom[k].ideas;}});
const calendar=document.getElementById('calendar');
const weekdayNames=['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];
const weekdayMap={'Понедельник':0,'Вторник':1,'Среда':2,'Четверг':3,'Пятница':4,'Суббота':5,'Воскресенье':6};
const labels=document.createElement('div');
labels.className='weekdays';
weekdayNames.forEach(name=>{const label=document.createElement('div');label.textContent=name;labels.append(label);});
const grid=document.createElement('div');
grid.className='grid';
calendar.append(labels,grid);
const firstDayOffset=weekdayMap[days[0][1]];
for(let pad=0;pad<firstDayOffset;pad++){const blank=document.createElement('div');blank.className='empty-day';grid.append(blank);}
days.forEach((d,i)=>{
  const [date,weekday,place,plan]=d;
  const monthName=date.split(' ')[1];
  const b=document.createElement('button');
  const dayNumber=Number(date.split(' ')[0]);
  const isVacation=(monthName==='декабря'&&dayNumber>=5&&dayNumber<=20)||(weekday==='Суббота'||weekday==='Воскресенье')||(monthName==='декабря'&&dayNumber===25);
  b.className='day'+(plan!=="—"?' special':'')+(isVacation?' vacation':'');
  b.dataset.i=i;
  const monthLabel=(i===0||date.startsWith('1 декабря'))?'<div class="month-stamp">'+(monthName==='ноября'?'НОЯ':'ДЕК')+'</div>':'';
  const planItems=String(d[3]||'').split(/[\n•]+/).map(x=>x.trim()).filter(Boolean);
  const preview=planItems.length?'<ul class="preview-plan">'+planItems.map(x=>'<li>'+escapeHTML(x)+'</li>').join('')+'</ul>':'<div class="preview-empty">＋ добавить обязательные планы</div>';
  b.innerHTML='<div class="photo-slot" data-photo-slot="'+i+'"><div class="photo-placeholder"><span>▧</span><span>Фото дня</span></div></div><div class="num">ДЕНЬ '+String(i+1).padStart(2,'0')+'</div>'+monthLabel+'<div class="date">'+date.split(' ')[0]+'</div><div class="weekday">'+weekday+'</div><div class="place">'+escapeHTML(place)+'</div>'+preview;

const overlay=document.getElementById('overlay');let current=0;const done=JSON.parse(localStorage.getItem('winter-trip-done')||'{}');
function escapeHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;');}
const photoUrls={};
let photoDB=null;
function openPhotoDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('Хранилище фотографий недоступно в этом браузере'));return;}const req=indexedDB.open('winter-trip-memory',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'});};req.onsuccess=()=>{photoDB=req.result;resolve(photoDB);};req.onerror=()=>reject(req.error);});}
function photoRequest(mode,action){return new Promise((resolve,reject)=>{if(!photoDB){reject(new Error('Хранилище ещё не готово'));return;}const tx=photoDB.transaction('photos',mode),store=tx.objectStore('photos'),req=action(store);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function compressPhoto(file){const bitmap=await createImageBitmap(file);const scale=Math.min(1,1400/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Не удалось обработать фото')),'image/webp',.78));}
async function savePhoto(i,file){const blob=await compressPhoto(file);await photoRequest('readwrite',store=>store.put({id:i,blob,updatedAt:Date.now()}));if(photoUrls[i])URL.revokeObjectURL(photoUrls[i]);photoUrls[i]=URL.createObjectURL(blob);renderCards();updateModalPhoto(i);}
async function removePhoto(i){await photoRequest('readwrite',store=>store.delete(i));if(photoUrls[i]){URL.revokeObjectURL(photoUrls[i]);delete photoUrls[i];}renderCards();updateModalPhoto(i);}
function updateModalPhoto(i){const wrap=document.getElementById('photoPreviewWrap');if(!wrap)return;wrap.innerHTML=photoUrls[i]?'<img class="photo-preview" src="'+photoUrls[i]+'" alt="Фото дня">':'<div class="photo-empty">Здесь будет твоя фотография дня</div>';const remove=document.getElementById('removePhoto');if(remove)remove.disabled=!photoUrls[i];}
async function loadPhotos(){try{await openPhotoDB();const rows=await photoRequest('readonly',store=>store.getAll());rows.forEach(row=>{if(row.blob instanceof Blob)photoUrls[row.id]=URL.createObjectURL(row.blob);});}catch(err){console.warn('Фото дня:',err);}renderCards();}
function renderCards(){document.querySelectorAll('.day').forEach(b=>{const i=Number(b.dataset.i),d=days[i],p=b.querySelector('.place');if(p)p.textContent=d[2];const slot=b.querySelector('.photo-slot');if(slot){slot.innerHTML=photoUrls[i]?'<img src="'+photoUrls[i]+'" alt="Фото дня">':'<div class="photo-placeholder"><span>▧</span><span>Фото дня</span></div>';}const old=b.querySelector('.preview-plan,.preview-empty');if(old)old.remove();const items=String(d[3]||'').split(/[\n•]+/).map(x=>x.trim()).filter(Boolean);if(items.length){const ul=document.createElement('ul');ul.className='preview-plan';items.forEach(x=>{const li=document.createElement('li');li.textContent=x;ul.append(li);});b.append(ul);}else{const empty=document.createElement('div');empty.className='preview-empty';empty.textContent='＋ добавить обязательные планы';b.append(empty);}});}
function renderDone(){document.querySelectorAll('.day').forEach(b=>b.classList.toggle('done',!!done[b.dataset.i]));}
function openDay(i){current=i;const d=days[i];document.getElementById('mdate').textContent=d[0]+' · '+d[1]+' · день '+(i+1)+' из '+days.length;document.getElementById('title').textContent=d[2];document.getElementById('mplace').textContent='Зимнее путешествие · 2026';document.getElementById('details').innerHTML='<section class="section"><h3>Фото дня</h3><div class="photo-section"><div id="photoPreviewWrap"></div><div class="photo-controls"><input type="file" id="photoInput" accept="image/*" aria-label="Выбрать фотографию дня"><button type="button" id="removePhoto">Удалить фото</button></div><div class="edit-help">Выбери одно главное фото этого дня. Оно останется на карточке и будет храниться в этом браузере.</div></div></section><section class="section"><h3>Название карточки</h3><input class="title-edit" id="editTitle" aria-label="Название карточки" value="'+escapeHTML(d[2])+'"></section><section class="section"><h3>Обязательные планы</h3><textarea class="edit-field" id="editPlan" aria-label="Обязательные планы">'+escapeHTML(d[3])+'</textarea><div class="edit-help">Каждый пункт с новой строки появится списком прямо на карточке.</div></section><section class="section"><h3>Идеи на день · варианты на выбор</h3><textarea class="edit-field" id="editIdeas" aria-label="Идеи на день">'+escapeHTML(d[4])+'</textarea><div class="edit-help">Можно менять текст, удалять варианты и добавлять свои идеи.</div></section><section class="section"><h3>Фильм на вечер · без повторов</h3><p class="film">'+escapeHTML(d[5])+'</p></section><p class="note">Твои правки сохраняются в этом браузере на этом устройстве. Чтобы изменить исходные рекомендации для всех посетителей, нужно обновить файл на GitHub.</p><div class="actions"><button class="save" id="saveText">Сохранить изменения</button><button id="resetText">Вернуть исходные рекомендации</button></div>';updateModalPhoto(i);document.getElementById('removePhoto').disabled=!photoUrls[i];document.getElementById('photoInput').onchange=async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Выбери файл изображения.');return;}try{await savePhoto(i,file);}catch(err){alert('Не удалось сохранить фото: '+err.message);}};document.getElementById('removePhoto').onclick=async()=>{try{await removePhoto(i);}catch(err){alert('Не удалось удалить фото: '+err.message);}};document.getElementById('saveText').onclick=()=>{days[i][2]=document.getElementById('editTitle').value.trim()||'Без названия';days[i][3]=document.getElementById('editPlan').value.trim();days[i][4]=document.getElementById('editIdeas').value.trim();custom[i]={title:days[i][2],plan:days[i][3],ideas:days[i][4]};localStorage.setItem('winter-trip-content',JSON.stringify(custom));renderCards();openDay(i);};document.getElementById('resetText').onclick=()=>{delete custom[i];localStorage.setItem('winter-trip-content',JSON.stringify(custom));location.reload();};document.getElementById('mark').textContent=done[i]?'✓ День отмечен':'✓ Отметить день';document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===days.length-1;overlay.classList.add('open');document.body.style.overflow='hidden';}
function close(){overlay.classList.remove('open');document.body.style.overflow='';}
document.getElementById('close').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.getElementById('prev').onclick=()=>openDay(current-1);document.getElementById('next').onclick=()=>openDay(current+1);document.getElementById('mark').onclick=()=>{done[current]=!done[current];localStorage.setItem('winter-trip-done',JSON.stringify(done));renderDone();openDay(current)};document.addEventListener('keydown',e=>{if(!overlay.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft'&&current>0)openDay(current-1);if(e.key==='ArrowRight'&&current<days.length-1)openDay(current+1)});renderCards();loadPhotos();renderDone();
</script></body></html>
